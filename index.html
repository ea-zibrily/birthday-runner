<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>hbed dik, tapi lari dl</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="score">0</div>
    <button id="mute-btn" aria-label="Toggle sound">🔊</button>
    <div id="best">BEST 0</div>
  </div>
  <div id="hint">Tap or Space to jump · Hold to duck</div>
  <div id="overlay">
    <h1>RUNNER</h1>
    <p>Tap / Space / ↑ to jump. Swipe down or ↓ to duck under obstacles.</p>
    <button id="start-btn">Start</button>
    <div id="countdown"></div>
  </div>

  <div id="glass-overlay">
    <div id="glass-panel">
      <h2 id="glass-title">Rough Round!</h2>
      <p id="glass-sub">3 tries down — vibe to the music or jump back in.</p>
      <div id="glass-btn-row">
        <button id="glass-birthday-btn" class="glass-btn glass-btn-sm" aria-label="yah lahir">🔊</button>
        <button id="glass-restart-btn" class="glass-btn glass-btn-lg" aria-label="Restart game">↻</button>
        <button id="glass-madrid-btn" class="glass-btn glass-btn-sm" aria-label="madridd madridd">🔊</button>
      </div>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
